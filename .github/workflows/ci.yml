name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            src/Lycoris/Lycoris.csproj
            tests/Lycoris.Tests/Lycoris.Tests.csproj

      - name: Build Release
        run: dotnet build Lycoris.slnx -c Release --warnaserror

      - name: Run tests
        run: dotnet test tests/Lycoris.Tests/Lycoris.Tests.csproj -c Release --no-build --blame-hang --blame-hang-timeout 180s

      - name: Self-test (Russian)
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'lycoris-selftest-ru'
          $exe = (Resolve-Path 'src/Lycoris/bin/Release/net10.0-windows10.0.19041.0/win-x64/Lycoris.exe').Path
          $process = Start-Process -FilePath $exe -ArgumentList @('--selftest', $report, '--no-elevate') -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "Russian self-test failed with exit code $($process.ExitCode)" }

      - name: Self-test (English)
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'lycoris-selftest-en'
          $exe = (Resolve-Path 'src/Lycoris/bin/Release/net10.0-windows10.0.19041.0/win-x64/Lycoris.exe').Path
          $process = Start-Process -FilePath $exe -ArgumentList @('--selftest', $report, '--lang', 'en', '--no-elevate') -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "English self-test failed with exit code $($process.ExitCode)" }

      - name: Upload self-test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-reports-${{ matrix.os }}
          path: ${{ runner.temp }}/lycoris-selftest-*/
          if-no-files-found: ignore
          retention-days: 7
